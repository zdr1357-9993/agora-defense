name: Refresh development preview
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/refresh-dev-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: sources/main
      - uses: actions/checkout@v4
        with:
          ref: develop
          path: sources/develop
      - uses: actions/checkout@v4
        with:
          ref: stage
          path: sources/stage
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sources/main/package-lock.json
            sources/develop/package-lock.json
            sources/stage/package-lock.json
      - name: Build unchanged production
        run: npm ci && npm run build
        working-directory: sources/main
      - name: Build development preview
        run: npm ci && npm run build
        working-directory: sources/develop
      - name: Build unchanged stage preview
        run: npm ci && npm run build
        working-directory: sources/stage
      - name: Assemble existing site with updated dev directory
        run: |
          mkdir -p site/dev site/stage
          cp -a sources/main/dist/. site/
          cp -a sources/develop/dist/. site/dev/
          cp -a sources/stage/dist/. site/stage/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: pages-dev-${{ github.run_id }}-${{ github.run_attempt }}
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-dev-${{ github.run_id }}-${{ github.run_attempt }}
