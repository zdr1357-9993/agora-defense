<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>철학사 랜덤 디펜스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Nanum+Myeongjo:wght@800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <!-- 홈: 스테이지 지도 -->
    <section id="home" class="screen">
      <h1 class="title"><span class="gold">AGORA</span> 철학사 랜덤 디펜스</h1>
      <p class="slogan">사유하라, 조합하라, 도그마를 논파하라!</p>
      <div id="stages"></div>
      <div class="row">
        <button id="open-codex">📖 도감</button>
        <button id="open-recipes">📜 조합표</button>
        <button id="open-rates">🎲 확률</button>
      </div>
      <div class="row">
        <button id="reset" class="ghost">진행 초기화</button>
      </div>
    </section>

    <!-- 도감 -->
    <section id="codex" class="screen hidden">
      <div class="row between"><h2>📖 도감 <small id="codex-count"></small></h2><button id="codex-back" class="ghost">닫기</button></div>
      <div id="codex-list"></div>
    </section>

    <!-- 전투 -->
    <section id="battle" class="screen hidden">
      <header id="hud">
        <button id="quit" class="ghost">✕</button>
        <span>💰 <b id="gold">0</b></span>
        <span>🧠 <b id="lives">0</b></span>
        <span>🌊 <b id="wave">0</b>/20</span>
        <button id="b-recipes">📜</button>
        <button id="speed">1x</button>
      </header>
      <div id="cats"></div>
      <canvas id="field"></canvas>
      <section id="context"><div id="info"></div><div id="synth"></div></section>
      <nav id="dock">
        <button id="summon">소환 <small>(<span id="cost">50</span>G)</small></button>
        <button id="sell">판매</button>
        <button id="start">웨이브 시작</button>
      </nav>
    </section>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
