<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>철학사 랜덤 디펜스</title>
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="stylesheet" href="/src/pastel.css" />
  <link rel="stylesheet" href="/src/pastel-assets.css" />
</head>
<body>
  <div id="app">
    <!-- 허브: 스테이지 · 고민방 · 뽑기 · 도감 -->
    <section id="home" class="screen">
      <header class="hub-top">
        <h1 class="title"><span class="gold">AGORA</span><small class="brand-subtitle">철학사 랜덤 디펜스</small></h1>
        <span class="top-right"><span id="wallet" class="wallet">🤔 0</span><button id="open-settings" class="icon-btn" aria-label="설정">⚙️</button></span>
      </header>
      <!-- 설정 시트: 계정·소리·튜토리얼·초기화·(마스터 도구) -->
      <div id="settings" class="settings hidden">
        <div class="settings-card">
          <div class="set-head"><b>⚙️ 설정</b><button id="close-settings" class="icon-btn">✕</button></div>
          <div class="acct-bar"><span id="who"></span><button id="logout" class="ghost small">로그아웃</button></div>
          <small class="release-label">20261110v3 · 파스텔 도트</small><div id="cloud-state" class="cloud-state">☁️ 서버 저장 꺼짐</div>
          <label class="backdrop-setting">고대 배경 (다른 시대는 자동)<select id="backdrop-select"><option value="greek-01">01 올리브 아고라</option><option value="greek-02">02 에게해 항구</option><option value="greek-03">03 월계수 학당</option><option value="greek-04">04 노을 신전</option><option value="greek-05">05 낙서 공책 아고라</option><option value="greek-06">06 파스텔 유적 제단</option><option value="era" selected>시대에 맞는 전용 풍경 (기본)</option></select></label><div class="set-grid">
            <button id="mute" class="chunky blue">🔊</button>
            <button id="tut-again" class="chunky mint">🎓 튜토리얼 다시 보기</button>
            <button id="replay-start" class="chunky gold">🏛 처음부터 튜토리얼 진행 (오프닝부터)</button>
            <button id="reset" class="ghost small">진행 초기화</button>
          </div>
          <div id="admin-bar" class="admin-bar hidden">👑 마스터
            <button id="admin-fx">스킬 연출 미리보기</button><button id="admin-gems">재화 지급</button><button id="admin-unlock">전부 클리어</button><button id="admin-cards">카드·도구 지급</button>
          </div>
        </div>
      </div>
      <div id="tab-stages" class="tab">
        <div id="stages"></div>
        <div class="home-tools">
          <button id="open-recipes" class="chunky mint">📜 조합표</button>
          <button id="open-rates" class="chunky blue">🎲 소환</button>
        </div>
      </div>
      <div id="tab-room" class="tab hidden"></div>
      <div id="tab-gacha" class="tab hidden"></div>
      <div id="tab-shop" class="tab hidden"></div>
      <div id="tab-codex" class="tab hidden">
        <div class="tab-head"><h2>📖 도감 <small id="codex-count"></small></h2><button id="tcg-open" class="tcg-open">🃏 넘겨보기</button></div>
        <div id="codex-list"></div>
      </div>
      <nav id="tabs">
        <button data-tab="stages"><img class="nav-pixel" data-art-icon="journey" alt=""><span>여정</span></button>
        <button data-tab="room"><img class="nav-pixel" data-art-icon="room" alt=""><span>고민방</span></button>
        <button data-tab="gacha"><img class="nav-pixel" data-art-icon="gacha" alt=""><span>뽑기</span></button>
        <button data-tab="codex"><img class="nav-pixel" data-art-icon="codex" alt=""><span>도감</span></button>
        <button data-tab="shop"><img class="nav-pixel" data-art-icon="shop" alt=""><span>상점</span></button>
      </nav>
    </section>

    <!-- 전투 -->
    <section id="battle" class="screen hidden">
      <header id="hud">
        
        <button id="quit" class="ghost">✕</button>
        <span id="diff-chip" class="diff-chip"></span>
        <span><img class="pixel-icon" data-art-icon="coin" alt="골드"> <b id="gold">0</b></span>
        <span><img class="pixel-icon" data-art-icon="room" alt="멘탈"> <b id="lives">0</b></span>
        <span class="wave-pill">🌊 <b id="wave">0</b>/<i id="wave-max">20</i><em class="wave-track"><em id="wave-bar"></em></em></span>
        <button id="b-recipes" aria-label="조합표">📜</button>
        <button id="mute-b">🔊</button>
        <button id="speed">1x</button>
      </header>
      <div id="cats"></div>
      <div id="battle-status-row"><div id="boss-status" role="status">보스는 10웨이브마다 등장해요</div></div>
      <div id="field-wrap"><canvas id="field"></canvas></div>
      <section id="selbar"><div id="info"></div></section>
      <div id="battle-actions">
        <section id="upgrade-panel" class="upgrade-panel hidden" aria-label="강화 구간 선택">
          <div class="upgrade-panel-head"><b>구간 강화</b><span>전장 배치 유닛 대상 · 대기석 제외</span></div>
          <div id="upgrade-bands"></div>
          <small class="upgrade-provisional">임시 비용 · 조정 예정 · 대상 전원 공격력 +35% (최대 Lv.5)</small>
        </section>
        <nav id="actions">
          <button id="sell"><i>🪙</i><span>판매</span></button>
          <button id="merge"><i>⚗</i><span>합성</span></button>
          <button id="upgrade-btn"><i>⬆</i><span>강화</span></button>
          <button id="d-recipes"><i>📜</i><span>조합표</span></button>
        </nav>
      </div>
      <nav id="dock">
        <button id="summon">소환 <small>(<span id="cost">40G</span>)</small></button>
        <button id="start">웨이브 시작</button>
      </nav>
    </section>
  </div>
  <div id="login" class="login hidden">
    <form id="login-form" class="login-card" autocomplete="on">
      <div id="login-card">
        <div class="login-art"><img data-login-hero alt="소크라테스"></div>
        <h1 class="title"><span class="gold">AGORA</span></h1>
        <p class="slogan">철학사 랜덤 디펜스</p><p class="login-quip">일단 소환하고, 생각은 나중에.</p>
        <input id="login-id" placeholder="아이디" autocomplete="username" autocapitalize="off" />
        <input id="login-pw" type="password" placeholder="비밀번호" inputmode="numeric" autocomplete="current-password" />
        <p id="login-err" class="err"></p>
        <button type="submit" class="chunky gold">입장하기</button>
        <button type="button" id="signup" class="ghost small">처음이에요 · 이 아이디로 가입하기</button>
        <p class="hint login-hint">아이디는 영문·숫자 3~12자, 비밀번호는 4자 이상</p>
      </div>
    </form>
  </div>
  <script type="module" src="/src/boot.ts"></script>
</body>
</html>
