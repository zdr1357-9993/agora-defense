<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>철학사 랜덤 디펜스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&family=Nanum+Myeongjo:wght@800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <!-- 허브: 스테이지 · 고민방 · 뽑기 · 도감 -->
    <section id="home" class="screen">
      <header class="hub-top">
        <h1 class="title"><span class="gold">AGORA</span> 철학사 랜덤 디펜스</h1>
        <span class="top-right"><button id="mute" class="icon-btn">🔊</button><span id="wallet" class="wallet">🤔 0</span></span>
      </header>
      <div id="tab-stages" class="tab">
        <p class="slogan">사유하라, 조합하라, 도그마를 논파하라!</p>
        <div id="stages"></div>
        <div class="row">
          <button id="open-recipes" class="chunky mint">📜 조합표</button>
          <button id="open-rates" class="chunky blue">🎲 확률</button>
        </div>
        <button id="reset" class="ghost">진행 초기화</button>
      </div>
      <div id="tab-room" class="tab hidden"></div>
      <div id="tab-gacha" class="tab hidden"></div>
      <div id="tab-shop" class="tab hidden"></div>
      <div id="tab-codex" class="tab hidden">
        <h2>📖 도감 <small id="codex-count"></small></h2>
        <div id="codex-list"></div>
      </div>
      <nav id="tabs">
        <button data-tab="stages">🏛<span>스테이지</span></button>
        <button data-tab="room">🤔<span>고민방</span></button>
        <button data-tab="gacha">🎴<span>뽑기</span></button>
        <button data-tab="codex">📖<span>도감</span></button>
        <button data-tab="shop">🛍<span>상점</span></button>
      </nav>
    </section>

    <!-- 전투 -->
    <section id="battle" class="screen hidden">
      <header id="hud">
        
        <button id="quit" class="ghost">✕</button>
        <span id="diff-chip" class="diff-chip"></span>
        <span>💰 <b id="gold">0</b></span>
        <span>🧠 <b id="lives">0</b></span>
        <span class="wave-pill">🌊 <b id="wave">0</b>/<i id="wave-max">20</i><em class="wave-track"><em id="wave-bar"></em></em></span>
        <button id="b-recipes">📜</button>
        <button id="mute-b">🔊</button>
        <button id="speed">1x</button>
      </header>
      <div id="cats"></div>
      <canvas id="field"></canvas>
      <section id="context"><div id="info"></div><div id="synth"></div></section>
      <nav id="dock">
        <button id="summon">소환 <small>(<span id="cost">50</span>G)</small></button>
        <button id="sell">판매</button>
        <button id="start">웨이브 시작</button>
      </nav>
    </section>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
