<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>철학사 랜덤 디펜스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&family=Nanum+Myeongjo:wght@800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="stylesheet" href="/src/pastel.css" />
</head>
<body>
  <div id="app">
    <!-- 허브: 스테이지 · 고민방 · 뽑기 · 도감 -->
    <section id="home" class="screen">
      <header class="hub-top">
        <h1 class="title"><span class="gold">AGORA</span> 철학사 랜덤 디펜스</h1>
        <span class="top-right"><span id="wallet" class="wallet">🤔 0</span><button id="open-settings" class="icon-btn" aria-label="설정">⚙️</button></span>
      </header>
      <!-- 설정 시트: 계정·소리·튜토리얼·초기화·(마스터 도구) -->
      <div id="settings" class="settings hidden">
        <div class="settings-card">
          <div class="set-head"><b>⚙️ 설정</b><button id="close-settings" class="icon-btn">✕</button></div>
          <div class="acct-bar"><span id="who"></span><button id="logout" class="ghost small">로그아웃</button></div>
          <div id="cloud-state" class="cloud-state">☁️ 서버 저장 꺼짐</div>
          <div class="set-grid">
            <button id="mute" class="chunky blue">🔊</button>
            <button id="tut-again" class="chunky mint">🎓 튜토리얼 다시 보기</button>
            <button id="replay-start" class="chunky gold">🏛 처음부터 튜토리얼 진행 (오프닝부터)</button>
            <button id="reset" class="ghost small">진행 초기화</button>
          </div>
          <div id="admin-bar" class="admin-bar hidden">👑 마스터
            <button id="admin-gems">재화 지급</button><button id="admin-unlock">전부 클리어</button><button id="admin-cards">카드·도구 지급</button>
          </div>
        </div>
      </div>
      <div id="tab-stages" class="tab">
        <div id="stages"></div>
        <div class="home-tools">
          <button id="open-recipes" class="chunky mint">📜 조합표</button>
          <button id="open-rates" class="chunky blue">🎲 소환</button>
        </div>
      </div>
      <div id="tab-room" class="tab hidden"></div>
      <div id="tab-gacha" class="tab hidden"></div>
      <div id="tab-shop" class="tab hidden"></div>
      <div id="tab-codex" class="tab hidden">
        <div class="tab-head"><h2>📖 도감 <small id="codex-count"></small></h2><button id="tcg-open" class="tcg-open">🃏 넘겨보기</button></div>
        <div id="codex-list"></div>
      </div>
      <nav id="tabs">
        <button data-tab="stages"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 12 L16 5 L28 12 Z" fill="#ffd9a8" stroke="#3b2a1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="6" y="13" width="20" height="2.5" fill="#fff3e2" stroke="#3b2a1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><g fill="#fffaf3" stroke="#3b2a1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><rect x="8" y="16" width="3" height="9"/><rect x="14.5" y="16" width="3" height="9"/><rect x="21" y="16" width="3" height="9"/></g><rect x="5" y="25" width="22" height="3" rx="1" fill="#e8925a" stroke="#3b2a1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg><span>여정</span></button>
        <button data-tab="room"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 19 a6 6 0 0 1 2-11 a7 7 0 0 1 13 0 a6 6 0 0 1 3 11 Z" fill="#dcefff" stroke="#3b2a1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="9" cy="24" r="2.2" fill="#dcefff" stroke="#3b2a1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="5.5" cy="28" r="1.3" fill="#dcefff" stroke="#3b2a1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M16 9 a4 4 0 0 1 2.5 7 v1.5 h-5 v-1.5 a4 4 0 0 1 2.5-7 Z" fill="#ffd36b" stroke="#3b2a1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M14 19 h4" stroke="#3b2a1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg><span>고민방</span></button>
        <button data-tab="gacha"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="7" width="13" height="18" rx="3" transform="rotate(-12 11 16)" fill="#c9b0ff" stroke="#3b2a1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="13" y="6" width="13" height="18" rx="3" transform="rotate(8 19 15)" fill="#ffb3c7" stroke="#3b2a1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M19.5 11 l1.3 2.8 3 .4 -2.2 2 .6 3 -2.7-1.5 -2.7 1.5 .6-3 -2.2-2 3-.4 Z" fill="#fff3b0" stroke="#3b2a1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.5"/></svg><span>뽑기</span></button>
        <button data-tab="codex"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 8 q6-3 12 0 v18 q-6-3-12 0 Z" fill="#a7ecd2" stroke="#3b2a1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M28 8 q-6-3-12 0 v18 q6-3 12 0 Z" fill="#fffaf3" stroke="#3b2a1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M19 13 h6 M19 17 h6 M19 21 h4" stroke="#3b2a1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.5"/><path d="M8 12 l3 2 -3 2" stroke="#3b2a1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.5" fill="none"/></svg><span>도감</span></button>
        <button data-tab="shop"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M11 11 v-2 a5 5 0 0 1 10 0 v2" fill="none" stroke="#3b2a1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M6 11 h20 l-1.5 15 a2 2 0 0 1-2 2 h-13 a2 2 0 0 1-2-2 Z" fill="#ffd36b" stroke="#3b2a1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M12 18 q4 4 8 0" fill="none" stroke="#3b2a1e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="12" cy="15" r="1" fill="#3b2a1e"/><circle cx="20" cy="15" r="1" fill="#3b2a1e"/></svg><span>상점</span></button>
      </nav>
    </section>

    <!-- 전투 -->
    <section id="battle" class="screen hidden">
      <header id="hud">
        
        <button id="quit" class="ghost">✕</button>
        <span id="diff-chip" class="diff-chip"></span>
        <span>💰 <b id="gold">0</b></span>
        <span>🧠 <b id="lives">0</b></span>
        <span class="wave-pill">🌊 <b id="wave">0</b>/<i id="wave-max">20</i><em class="wave-track"><em id="wave-bar"></em></em></span>
        <button id="b-recipes">📜</button>
        <button id="mute-b">🔊</button>
        <button id="speed">1x</button>
      </header>
      <div id="cats"></div>
      <div id="field-wrap"><canvas id="field"></canvas></div>
      <section id="selbar"><div id="info"></div></section>
      <nav id="actions">
        <button id="sell"><i>🪙</i><span>판매</span></button>
        <button id="merge"><i>⚗</i><span>합성</span></button>
        <button id="upgrade-btn"><i>⬆</i><span>강화</span></button>
        <button id="d-recipes"><i>📜</i><span>조합표</span></button>
      </nav>
      <nav id="dock">
        <button id="summon">소환 <small>(<span id="cost">40G</span>)</small></button>
        <button id="start">웨이브 시작</button>
      </nav>
    </section>
  </div>
  <div id="login" class="login hidden">
    <form id="login-form" class="login-card" autocomplete="on">
      <div id="login-card">
        <div class="login-art">🏛</div>
        <h1 class="title"><span class="gold">AGORA</span></h1>
        <p class="slogan">철학사 랜덤 디펜스</p>
        <input id="login-id" placeholder="아이디" autocomplete="username" autocapitalize="off" />
        <input id="login-pw" type="password" placeholder="비밀번호" inputmode="numeric" autocomplete="current-password" />
        <p id="login-err" class="err"></p>
        <button type="submit" class="chunky gold">입장하기</button>
        <button type="button" id="signup" class="ghost small">처음이에요 · 이 아이디로 가입하기</button>
        <p class="hint login-hint">아이디는 영문·숫자 3~12자, 비밀번호는 4자 이상</p>
      </div>
    </form>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
